    /v1/number-pool/search:
        get:
            summary: Search available phone numbers
            operationId: searchAvailableNumbers
            description: >
                Returns a list of phone numbers available to purchase from the configured
                telephony provider, filtered by country and (optionally) a matching pattern.
            tags:
                - Telephony
            parameters:
                - $ref: '#/components/parameters/PublicKeyHeader'
                - $ref: '#/components/parameters/PrivateKeyHeader'
                - $ref: '#/components/parameters/OrganizationHeader'
                - name: countryCode
                  in: query
                  required: true
                  description: '2-letter ISO country code (case-insensitive).'
                  schema:
                      type: string
                      minLength: 2
                      maxLength: 2
                      example: IN
                - name: numberType
                  in: query
                  required: false
                  schema:
                      type: string
                      enum: [local]
                      example: local
                - name: pattern
                  in: query
                  required: false
                  description: 'Optional digit/letter pattern to match within available numbers.'
                  schema:
                      type: string
                      example: '415'
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 50
                      default: 20
                - name: provider
                  in: query
                  required: false
                  schema:
                      type: string
                      default: miraiminds
                      example: miraiminds
            responses:
                '200':
                    description: Available numbers fetched successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Available numbers fetched successfully
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/AvailableNumber'
                            example:
                                message: Available numbers fetched successfully
                                data:
                                    - number: '+918155550101'
                                      countryCode: IN
                                      numberType: local
                                      monthlyRateCents: 100
                                      setupFeeCents: 0
                                    - number: '+918155550102'
                                      countryCode: IN
                                      numberType: local
                                      monthlyRateCents: 100
                                      setupFeeCents: 0
                '400':
                    description: Validation Error

