                                        identity:
                                            name: neha
                                            gender: female
                                            voice: neha
                                        systemPrompt: ''
                            ndrFollowup:
                                summary: NDR follow-up assistant
                                description: >
                                    For `variant.type: ndr_followup`. The system prompt is auto-generated
                                    from the variant template — leave `agent.systemPrompt` empty.
                                value:
                                    name: 'NDR Follow-up Assistant'
                                    variant:
                                        type: ndr_followup
                                        config:
                                            ndr_followup:
                                                maxRescheduleDays: 3
                                                webhookToken: 'shiprocket-secret'
                                                supportContacts:
                                                    phoneNumber: '+919876543210'
                                                    email: 'support@example.com'
                                    agent:
                                        identity:
                                            name: neha
                                            gender: female
                                            voice: neha
                                        systemPrompt: ''
            responses:
                '200':
                    description: Assistant Created
                    content:
                        application/json:
                            schema:
                                type: object
