<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif">
  <!-- timeline axis -->
  <line x1="60" y1="44" x2="840" y2="44" stroke="#2E332F" stroke-width="2"/>
  <rect x="500" y="34" width="330" height="20" rx="10" fill="#07C983" opacity="0.14"/>
  <circle cx="264" cy="44" r="6" fill="#07C983"/>
  <text x="264" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#07C983" letter-spacing="1">TODAY</text>
  <text x="665" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#07C983" letter-spacing="1">NEXT</text>
  <line x1="264" y1="52" x2="264" y2="84" stroke="#3A423C" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="665" y1="56" x2="665" y2="84" stroke="#3A423C" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- live-now card: 2 cols -->
  <rect x="60" y="84" width="408" height="216" rx="12" fill="#1B201C" stroke="#2E3A33" stroke-width="1.5"/>
  <text x="84" y="118" font-size="11" font-weight="700" fill="#07C983" letter-spacing="1.5">LIVE NOW</text>
  <!-- Hindi -->
  <rect x="84" y="134" width="172" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="98" y="162" font-size="17" fill="#E8EAE8">हिन्दी</text>
  <text x="166" y="156" font-size="13" font-weight="600" fill="#E8EAE8">Hindi</text>
  <text x="166" y="171" font-size="11" fill="#9AA39D">TTS and STT</text>
  <!-- Hinglish -->
  <rect x="272" y="134" width="172" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="286" y="162" font-size="15" fill="#E8EAE8">हि + En</text>
  <text x="354" y="156" font-size="13" font-weight="600" fill="#E8EAE8">Hinglish</text>
  <text x="354" y="171" font-size="11" fill="#9AA39D">TTS and STT</text>
  <!-- English -->
  <rect x="84" y="186" width="172" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="98" y="214" font-size="15" fill="#E8EAE8">En</text>
  <text x="166" y="208" font-size="13" font-weight="600" fill="#E8EAE8">English</text>
  <text x="166" y="223" font-size="11" fill="#9AA39D">TTS and STT</text>
  <!-- Gujarati -->
  <rect x="272" y="186" width="172" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="286" y="214" font-size="17" fill="#E8EAE8">ગુજરાતી</text>
  <text x="354" y="208" font-size="13" font-weight="600" fill="#E8EAE8">Gujarati</text>
  <text x="354" y="223" font-size="11" fill="#9AA39D">TTS and STT</text>
  <!-- Tamil -->
  <rect x="84" y="238" width="172" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="98" y="266" font-size="17" fill="#E8EAE8">தமிழ்</text>
  <text x="166" y="260" font-size="13" font-weight="600" fill="#E8EAE8">Tamil</text>
  <text x="166" y="275" font-size="11" fill="#9AA39D">TTS and STT</text>
  <!-- Telugu -->
  <rect x="272" y="238" width="172" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="286" y="266" font-size="17" fill="#E8EAE8">తెలుగు</text>
  <text x="354" y="260" font-size="13" font-weight="600" fill="#E8EAE8">Telugu</text>
  <text x="354" y="275" font-size="11" fill="#9AA39D">TTS and STT</text>

  <!-- next card -->
  <rect x="500" y="84" width="340" height="216" rx="12" fill="#17211B" stroke="#07C983" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="524" y="118" font-size="11" font-weight="700" fill="#07C983" letter-spacing="1.5">NEXT · DATES TO BE ANNOUNCED</text>
  <!-- Bengali -->
  <rect x="524" y="134" width="292" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="538" y="162" font-size="17" fill="#E8EAE8">বাংলা</text>
  <text x="606" y="156" font-size="13" font-weight="600" fill="#E8EAE8">Bengali</text>
  <text x="606" y="171" font-size="11" fill="#9AA39D">97M speakers</text>
  <!-- Marathi -->
  <rect x="524" y="186" width="292" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="538" y="214" font-size="17" fill="#E8EAE8">मराठी</text>
  <text x="606" y="208" font-size="13" font-weight="600" fill="#E8EAE8">Marathi</text>
  <text x="606" y="223" font-size="11" fill="#9AA39D">83M speakers</text>
  <!-- Kannada -->
  <rect x="524" y="238" width="292" height="44" rx="8" fill="#212823" stroke="#33413A"/>
  <text x="538" y="266" font-size="17" fill="#E8EAE8">ಕನ್ನಡ</text>
  <text x="606" y="260" font-size="13" font-weight="600" fill="#E8EAE8">Kannada</text>
  <text x="606" y="275" font-size="11" fill="#9AA39D">44M speakers</text>

  <!-- footer -->
  <text x="450" y="340" text-anchor="middle" font-size="13" fill="#9AA39D">Each language ships when it clears the same quality bar as our Hindi voices —</text>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#9AA39D">dates are announced here as they land.</text>
</svg>
