<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif">
  <!-- timeline axis -->
  <line x1="60" y1="44" x2="840" y2="44" stroke="#D8DED9" stroke-width="2"/>
  <rect x="380" y="34" width="440" height="20" rx="10" fill="#16A34A" opacity="0.12"/>
  <circle cx="140" cy="44" r="6" fill="#16A34A"/>
  <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D" letter-spacing="1">TODAY</text>
  <text x="600" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D" letter-spacing="1">THE NEXT TWO MONTHS</text>
  <line x1="140" y1="52" x2="140" y2="84" stroke="#C9D3CC" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="600" y1="56" x2="600" y2="84" stroke="#C9D3CC" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- live-now card -->
  <rect x="60" y="84" width="280" height="216" rx="12" fill="#FFFFFF" stroke="#DDE4DF" stroke-width="1.5"/>
  <text x="84" y="118" font-size="11" font-weight="700" fill="#15803D" letter-spacing="1.5">LIVE NOW</text>
  <text x="84" y="150" font-size="16" font-weight="600" fill="#1A1A1A">Hindi</text>
  <text x="84" y="176" font-size="16" font-weight="600" fill="#1A1A1A">Hinglish</text>
  <text x="84" y="202" font-size="16" font-weight="600" fill="#1A1A1A">English code-switch</text>
  <text x="84" y="238" font-size="12" fill="#6B7280">On every production call</text>
  <text x="84" y="256" font-size="12" fill="#6B7280">today.</text>

  <!-- six-languages card -->
  <rect x="380" y="84" width="460" height="216" rx="12" fill="#F4FAF6" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="404" y="118" font-size="11" font-weight="700" fill="#15803D" letter-spacing="1.5">SIX NEW LANGUAGES · DATES TO BE ANNOUNCED</text>

  <!-- chips: 2 cols x 3 rows, ordered by speakers -->
  <!-- Bengali -->
  <rect x="404" y="134" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#D5E3DA"/>
  <text x="418" y="162" font-size="17" fill="#1A1A1A">বাংলা</text>
  <text x="480" y="156" font-size="13" font-weight="600" fill="#1A1A1A">Bengali</text>
  <text x="480" y="171" font-size="11" fill="#6B7280">97M speakers</text>
  <!-- Marathi -->
  <rect x="620" y="134" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#D5E3DA"/>
  <text x="634" y="162" font-size="17" fill="#1A1A1A">मराठी</text>
  <text x="696" y="156" font-size="13" font-weight="600" fill="#1A1A1A">Marathi</text>
  <text x="696" y="171" font-size="11" fill="#6B7280">83M speakers</text>
  <!-- Telugu -->
  <rect x="404" y="186" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#D5E3DA"/>
  <text x="418" y="214" font-size="17" fill="#1A1A1A">తెలుగు</text>
  <text x="480" y="208" font-size="13" font-weight="600" fill="#1A1A1A">Telugu</text>
  <text x="480" y="223" font-size="11" fill="#6B7280">81M speakers</text>
  <!-- Tamil -->
  <rect x="620" y="186" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#D5E3DA"/>
  <text x="634" y="214" font-size="17" fill="#1A1A1A">தமிழ்</text>
  <text x="696" y="208" font-size="13" font-weight="600" fill="#1A1A1A">Tamil</text>
  <text x="696" y="223" font-size="11" fill="#6B7280">69M speakers</text>
  <!-- Gujarati -->
  <rect x="404" y="238" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#D5E3DA"/>
  <text x="418" y="266" font-size="17" fill="#1A1A1A">ગુજરાતી</text>
  <text x="480" y="260" font-size="13" font-weight="600" fill="#1A1A1A">Gujarati</text>
  <text x="480" y="275" font-size="11" fill="#6B7280">56M speakers</text>
  <!-- Kannada -->
  <rect x="620" y="238" width="196" height="44" rx="8" fill="#FFFFFF" stroke="#D5E3DA"/>
  <text x="634" y="266" font-size="17" fill="#1A1A1A">ಕನ್ನಡ</text>
  <text x="696" y="260" font-size="13" font-weight="600" fill="#1A1A1A">Kannada</text>
  <text x="696" y="275" font-size="11" fill="#6B7280">44M speakers</text>

  <!-- footer -->
  <text x="450" y="340" text-anchor="middle" font-size="13" fill="#6B7280">Each language ships when it clears the same quality bar as our Hindi voices —</text>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#6B7280">dates are announced here as they land.</text>
</svg>
